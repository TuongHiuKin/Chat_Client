name: Docker Hub CI-CD

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

# Only merged PRs publish. Keep release runs from writing shared tags concurrently.
concurrency:
  group: docker-hub-main-release
  cancel-in-progress: false

env:
  IMAGE_NAME: tuongkien/chat-server

jobs:
  validate:
    if: github.event.pull_request.merged == true
    name: Build and test Lab2
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Build server, client and tests
        run: dotnet build Lab2.Tests/Lab2.Tests.csproj --configuration Release
      - name: Start isolated test SQL instance
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'Unable to start SQL LocalDB.' }
      - name: TCP and SQL integration tests
        env:
          LAB2_TEST_SQL: 'Server=(localdb)\MSSQLLocalDB;Integrated Security=true;Encrypt=false;TrustServerCertificate=true'
        run: dotnet run --project Lab2.Tests --configuration Release --no-build -- --quick
      - name: WPF rendering and color emoji smoke test
        run: dotnet run --project Lab2.Tests --configuration Release --no-build -- --ui

  docker-test:
    if: github.event.pull_request.merged == true
    name: Test image (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [no-db, all-in-one]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image locally for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ChatServer/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: chat-server:test
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Test SQL startup, group chat and attachment round-trip
        env:
          IMAGE_TARGET: ${{ matrix.target }}
        run: python3 scripts/docker_smoke.py --image chat-server:test --target "$IMAGE_TARGET"

  publish:
    name: Publish (${{ matrix.target }})
    needs: [validate, docker-test]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [no-db, all-in-one]
    steps:
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Add the repository secret DOCKERHUB_TOKEN (Docker Hub Read & Write token for tuongkien), then re-run failed jobs. No image has been published.'
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Docker Hub login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: tuongkien
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image tags
        id: tags
        env:
          TARGET: ${{ matrix.target }}
        run: |
          {
            echo 'tags<<EOF'
            echo "${IMAGE_NAME}:${TARGET}"
            if [[ "$TARGET" == 'no-db' ]]; then echo "${IMAGE_NAME}:latest"; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Push tested image to Docker Hub
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ChatServer/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.merge_commit_sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          provenance: mode=min
          sbom: true
      - name: Publish summary
        env:
          TARGET: ${{ matrix.target }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published ${IMAGE_NAME} (${TARGET})"
            echo "Digest: \`${DIGEST}\`"
            echo "Pull updated image: \`docker pull ${IMAGE_NAME}:${TARGET}\`"
          } >> "$GITHUB_STEP_SUMMARY"
